<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --ink:#424242; --mute:#8c8c8c; --line:#e3e3e3; --a:#4DBBD5; --b:#F39B7F; --bg:#ffffff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
               font:14px/1.35 Arial, Helvetica, sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  header { padding:10px 18px 6px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  #status { font-size:14px; }
  main { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr); min-height:0; }
  #stage { position:relative; min-height:0; border-top:1px solid var(--line); border-right:1px solid var(--line); }
  #v3d { position:absolute; inset:0; }
  #views { position:absolute; left:10px; top:10px; display:flex; gap:6px; flex-wrap:wrap; z-index:5; max-width:calc(100% - 20px); }
  #hint { position:absolute; left:12px; bottom:8px; color:var(--mute); font-size:12px; z-index:5; pointer-events:none; }
  aside { display:grid; grid-template-rows:minmax(0,1fr) auto auto; min-height:0; border-top:1px solid var(--line); }
  #map { width:100%; height:100%; min-height:0; }
  #legend { display:flex; flex-wrap:wrap; gap:4px 6px; padding:4px 12px 6px; }
  #timeline { width:100%; height:150px; display:block; cursor:ew-resize; touch-action:none; }
  footer { display:flex; align-items:center; gap:10px; padding:8px 14px; border-top:1px solid var(--line); flex-wrap:wrap; }
  button, select, .chip { font:inherit; font-size:13px; color:var(--ink); background:#fff; border:1px solid #c9c9c9;
           border-radius:6px; padding:4px 10px; cursor:pointer; }
  button:hover, .chip:hover { border-color:var(--ink); }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #play { width:42px; font-size:15px; }
  #scrub { flex:1; min-width:140px; accent-color:var(--ink); }
  label.t { display:flex; align-items:center; gap:4px; font-size:13px; white-space:nowrap; }
  .chip { display:flex; align-items:center; gap:6px; padding:2px 8px; font-size:12px; user-select:none; }
  .chip.off { opacity:.35; }
  .chip svg { flex:none; }
  #map text { font-family:Arial, Helvetica, sans-serif; }
  #map .node, #map .edge { cursor:pointer; }
  #map .node rect { stroke:var(--ink); }
  #map .sel rect { stroke:#000; stroke-width:2.6px !important; }
  @media (max-width:820px) { main { grid-template-columns:1fr; grid-template-rows:1.2fr 1fr; } }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><div id="status"></div></header>
  <main>
    <div id="stage">
      <div id="v3d"></div>
      <div id="views">
        <button data-view="overview">Overview</button>
        <button data-view="interface">Interface</button>
        <button data-view="fromA" id="bA"></button>
        <button data-view="fromB" id="bB"></button>
        <button data-view="top">Top</button>
        <button id="tour">▶ Tour</button>
        <button id="rock">Rock</button>
      </div>
      <div id="hint">drag to rotate · scroll to zoom · click a contact or residue on the map to fly to it</div>
    </div>
    <aside>
      <svg id="map"></svg>
      <div id="legend"></div>
      <svg id="timeline"></svg>
    </aside>
  </main>
  <footer>
    <button id="play" title="play / pause (space)">▶</button>
    <input id="scrub" type="range" min="0" value="0" step="1">
    <select id="speed" title="frames per second"><option value="4">slow</option><option value="10" selected>normal</option><option value="20">fast</option></select>
    <label class="t"><input type="checkbox" id="showA" checked> <span id="lA"></span></label>
    <label class="t"><input type="checkbox" id="showB" checked> <span id="lB"></span></label>
    <select id="labels" title="distance labels"><option value="key">key distances</option><option value="all">all distances</option><option value="off">no labels</option></select>
    <label class="t"><input type="checkbox" id="names"> residue names</label>
  </footer>
</div>
<script>__3DMOL__</script>
<script>
const D = __DATA__;
const F = D.nframes, N = D.natoms, NP = D.npoints, A = D.atoms, [CA, CB] = D.chains;
const INK = '#424242', COL = {[CA]: '#4DBBD5', [CB]: '#F39B7F'};
const $ = id => document.getElementById(id);
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---- coordinates: int16, 0.01 Å. Per frame the N atoms, then the centres of rings contacts end on (NP in all)
const raw = atob(D.coords), bytes = new Uint8Array(raw.length);
for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
const xyz = new Int16Array(bytes.buffer);
const P = (f, i) => { const o = (f * NP + i) * 3; return {x: xyz[o] / 100, y: xyz[o + 1] / 100, z: xyz[o + 2] / 100}; };

function pdbText() {
  const pre = [], suf = [], out = [];
  for (let i = 0; i < N; i++) {
    const nm = A.name[i].length === 4 ? A.name[i] : (' ' + A.name[i]).padEnd(4);
    pre.push('ATOM  ' + String((i + 1) % 100000).padStart(5) + ' ' + nm + ' ' + A.resn[i].padStart(3) + ' ' +
             A.chain[i] + String(A.resi[i]).padStart(4) + '    ');
    suf.push('  1.00  0.00          ' + A.elem[i].padStart(2));
  }
  for (let f = 0; f < F; f++) {
    out.push('MODEL ' + (f + 1));
    for (let i = 0; i < N; i++) {
      const o = (f * NP + i) * 3;
      out.push(pre[i] + (xyz[o] / 100).toFixed(3).padStart(8) + (xyz[o + 1] / 100).toFixed(3).padStart(8) +
               (xyz[o + 2] / 100).toFixed(3).padStart(8) + suf[i]);
    }
    out.push('ENDMDL');
  }
  return out.join('\n');
}

// ---- state
let cur = 0, playing = false, timer = null, busy = false, selected = null;
const typeOn = {};
D.types.forEach(t => typeOn[t.name] = true);
const TYPE = Object.fromEntries(D.types.map(t => [t.name, t]));
const visible = c => typeOn[c.type];

// ---- 3D
const viewer = $3Dmol.createViewer($('v3d'), {backgroundColor: 'white', antialias: true});
viewer.addModelsAsFrames(pdbText(), 'pdb');
const resiOf = ch => D.interface[ch];
function styleAll() {
  viewer.setStyle({}, {});
  for (const ch of [CA, CB]) {
    const map = {C: COL[ch], N: '#3C5488', O: '#E64B35', S: '#D9A400'};
    if ($(ch === CA ? 'showA' : 'showB').checked)
      viewer.setStyle({chain: ch}, {cartoon: {color: COL[ch], opacity: 0.82}});
    viewer.addStyle({chain: ch, resi: resiOf(ch), not: {atom: ['N', 'C', 'O']}},
                    {stick: {radius: 0.17, colorscheme: {prop: 'elem', map}}});
  }
}
styleAll();

let shapes = [], labels = [];
function drawContacts(f) {
  shapes.forEach(s => viewer.removeShape(s)); labels.forEach(l => viewer.removeLabel(l));
  shapes = []; labels = [];
  const mode = $('labels').value, named = new Map();
  D.contacts.forEach((c, k) => {
    const o = c.occ[f];
    if (o < 0.35 || !visible(c)) return;
    const a = P(f, c.ia[f]), b = P(f, c.ib[f]), t = TYPE[c.type], sel = selected === k;
    const w = c.water && c.water[f] ? {x: c.water[f][0], y: c.water[f][1], z: c.water[f][2]} : null;
    for (const [p, q] of w ? [[a, w], [w, b]] : [[a, b]])   // a water-mediated contact goes through its water
      shapes.push(viewer.addCylinder({start: p, end: q, radius: sel ? 0.13 : 0.07, color: t.color, dashed: true,
                                      dashLength: 0.28, gapLength: 0.16, fromCap: 1, toCap: 1, opacity: Math.min(1, o + 0.15)}));
    if (w) shapes.push(viewer.addSphere({center: w, radius: 0.45, color: '#E64B35', opacity: Math.min(1, o + 0.15)}));
    if (mode === 'all' || sel || (mode === 'key' && t.directional))
      labels.push(viewer.addLabel(c.dist[f].toFixed(1) + ' Å', {
        position: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2}, fontSize: sel ? 15 : 12,
        fontColor: t.color, backgroundColor: 'white', backgroundOpacity: 0.8, borderThickness: 0, inFront: true,
        alignment: 'center'}));
    if ($('names').checked || sel) { named.set(CA + c.ra, c.ia[f]); named.set(CB + c.rb, c.ib[f]); }
  });
  named.forEach((i, key) => labels.push(viewer.addLabel(short(key.slice(1)), {
    position: P(f, i), fontSize: 11, fontColor: INK, backgroundColor: COL[key[0]], backgroundOpacity: 0.85,
    borderThickness: 0, inFront: true, screenOffset: {x: 8, y: -8}})));
}
const short = r => { const [n, i] = r.split(' '); return (D.amino.includes(n) ? n[0] + n.slice(1).toLowerCase() : n) + ' ' + i; };

// ---- camera: coordinates arrive with chain a on the left, chain b on the right, interface edge-on
const S = Math.SQRT1_2;
const QUAT = {overview: [0, 0, 0, 1], interface: [0, 0, 0, 1], fromA: [0, S, 0, S], fromB: [0, -S, 0, S], top: [S, 0, 0, S]};
let HOME = {};
function measureViews() {
  viewer.setView([0, 0, 0, 0, 0, 0, 0, 1]);
  viewer.zoomTo(); HOME.overview = viewer.getView();
  viewer.zoomTo({or: [{chain: CA, resi: resiOf(CA)}, {chain: CB, resi: resiOf(CB)}]}); viewer.zoom(0.7);
  HOME.interface = viewer.getView();
}
const viewOf = name => { const h = (name === 'overview' ? HOME.overview : HOME.interface).slice(); h.splice(4, 4, ...QUAT[name]); return h; };
const qmul = (a, b) => [a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1], a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
                        a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3], a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
const qY = deg => [0, Math.sin(deg * Math.PI / 360), 0, Math.cos(deg * Math.PI / 360)];
let camJob = 0;
function flyTo(target, ms = 900) {
  const job = ++camJob, from = viewer.getView(), t0 = performance.now();
  let dot = 0; for (let i = 4; i < 8; i++) dot += from[i] * target[i];
  const to = target.map((v, i) => i >= 4 && dot < 0 ? -v : v);
  return new Promise(done => {
    (function step(now) {
      if (job !== camJob) return done(false);
      const u = Math.min(1, (now - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      const v = from.map((x, i) => x + (to[i] - x) * e);
      const n = Math.hypot(v[4], v[5], v[6], v[7]); for (let i = 4; i < 8; i++) v[i] /= n;
      viewer.setView(v);
      u < 1 ? requestAnimationFrame(step) : done(true);
    })(t0);
  });
}
function orbit(base, degrees, ms) {       // turn about the vertical axis, starting from `base`
  const job = ++camJob, t0 = performance.now();
  return new Promise(done => {
    (function step(now) {
      if (job !== camJob) return done(false);
      const u = Math.min(1, (now - t0) / ms), v = base.slice();
      v.splice(4, 4, ...qmul(qY(degrees * u), base.slice(4)));
      viewer.setView(v);
      u < 1 ? requestAnimationFrame(step) : done(true);
    })(t0);
  });
}
let rocking = false;
function rock() {
  const job = ++camJob, base = viewer.getView(), t0 = performance.now();
  (function step(now) {
    if (job !== camJob || !rocking) { rocking = false; $('rock').classList.remove('on'); return; }
    const v = base.slice();
    v.splice(4, 4, ...qmul(qY(22 * Math.sin((now - t0) / 1400)), base.slice(4)));
    viewer.setView(v);
    requestAnimationFrame(step);
  })(t0);
}
async function tour() {
  $('tour').classList.add('on');
  if (!playing) toggle();
  const ok = await flyTo(viewOf('overview'), 900) && await new Promise(r => setTimeout(() => r(true), 700))
    && await flyTo(viewOf('interface'), 1600) && await orbit(viewOf('interface'), 360, 11000)
    && await flyTo(viewOf('top'), 1500) && await new Promise(r => setTimeout(() => r(true), 1500))
    && await flyTo(viewOf('interface'), 1500);
  $('tour').classList.remove('on');
  return ok;
}

// ---- 2D map
const map = $('map'), W = 520, rowH = 34, nRows = Math.max(D.left.length, D.right.length, 2), H = nRows * rowH + 70;
map.setAttribute('viewBox', `0 0 ${W} ${H}`);
const xL = 118, xR = W - 118;
const yOf = (i, n) => 52 + (n > 1 ? i * (nRows - 1) / (n - 1) : (nRows - 1) / 2) * rowH;
const lY = Object.fromEntries(D.left.map((r, i) => [r.res, yOf(i, D.left.length)]));
const rY = Object.fromEntries(D.right.map((r, i) => [r.res, yOf(i, D.right.length)]));
svgEl('text', {x: xL, y: 24, 'text-anchor': 'end', 'font-size': 16, 'font-weight': 'bold', fill: COL[CA]}, map).textContent = D.sides[0];
svgEl('text', {x: xR, y: 24, 'text-anchor': 'start', 'font-size': 16, 'font-weight': 'bold', fill: COL[CB]}, map).textContent = D.sides[1];
const edgeLayer = svgEl('g', {}, map), nodeLayer = svgEl('g', {}, map);
const edges = [], pairCount = {}, pairSeen = {};
D.contacts.forEach(c => { if (c.drawn) pairCount[c.ra + '|' + c.rb] = (pairCount[c.ra + '|' + c.rb] || 0) + 1; });
D.contacts.forEach((c, k) => {
  if (!c.drawn) return;
  const key = c.ra + '|' + c.rb, m = pairSeen[key] = (pairSeen[key] || 0) + 1, n = pairCount[key];
  const y0 = lY[c.ra], y1 = rY[c.rb], bend = (m - 1 - (n - 1) / 2) * 16, t = TYPE[c.type];
  const x0 = xL + 6, x1 = xR - 6, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + bend;
  const g = svgEl('g', {class: 'edge'}, edgeLayer);
  svgEl('path', {d: `M${x0},${y0} Q${cx},${cy} ${x1},${y1}`, fill: 'none', stroke: 'transparent', 'stroke-width': 10}, g);
  const path = svgEl('path', {d: `M${x0},${y0} Q${cx},${cy} ${x1},${y1}`, fill: 'none', stroke: t.color,
                              'stroke-dasharray': t.dash, 'stroke-linecap': 'round'}, g);
  const u = 0.2 + 0.6 * ((edges.length * 0.618) % 1), q = s => [(1 - s) * (1 - s) * x0 + 2 * (1 - s) * s * cx + s * s * x1,
                                                                  (1 - s) * (1 - s) * y0 + 2 * (1 - s) * s * cy + s * s * y1];
  const [bx, by] = q(u);
  svgEl('circle', {cx: bx, cy: by, r: 8, fill: '#fff', stroke: t.color}, g);
  svgEl('text', {x: bx, y: by + 3.5, 'text-anchor': 'middle', 'font-size': 9.5, fill: t.color}, g).textContent = t.badge;
  let dist = null;
  if (t.directional) dist = svgEl('text', {x: bx + 11, y: by - 4, 'font-size': 10.5, fill: t.color, 'paint-order': 'stroke',
                                           stroke: '#fff', 'stroke-width': 3}, g);
  g.addEventListener('click', () => focusContact(k));
  edges.push({k, g, path, dist});
});
const nodes = [];
function addNode(r, x, y, anchor, chain) {
  const g = svgEl('g', {class: 'node'}, nodeLayer), label = short(r.res), w = label.length * 7.4 + 14;
  const rect = svgEl('rect', {x: anchor === 'end' ? x - w : x, y: y - 11, width: w, height: 22, rx: 5, fill: r.fill}, g);
  svgEl('text', {x: anchor === 'end' ? x - w / 2 : x + w / 2, y: y + 4.5, 'text-anchor': 'middle', 'font-size': 12.5,
                 'font-weight': 'bold', fill: INK}, g).textContent = label;
  g.addEventListener('click', () => focusResidue(chain, r.res));
  nodes.push({g, rect, r});
}
D.left.forEach(r => addNode(r, xL, lY[r.res], 'end', CA));
D.right.forEach(r => addNode(r, xR, rY[r.res], 'start', CB));

function focusContact(k) {
  selected = selected === k ? null : k;
  const c = D.contacts[k];
  if (selected !== null) { ++camJob; viewer.zoomTo({or: [{chain: CA, resi: D.number[CA][c.ra]}, {chain: CB, resi: D.number[CB][c.rb]}]}, 700); }
  refresh();
}
function focusResidue(chain, res) { selected = null; ++camJob; viewer.zoomTo({chain, resi: D.number[chain][res], expand: 6}, 700); refresh(); }

// ---- legend chips toggle contact types
D.types.forEach(t => {
  const chip = document.createElement('div'); chip.className = 'chip';
  chip.innerHTML = `<svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="${t.color}" stroke-width="2" stroke-dasharray="${t.dash}"/></svg>${t.badge}&nbsp; ${t.name}`;
  chip.onclick = () => { typeOn[t.name] = !typeOn[t.name]; chip.classList.toggle('off', !typeOn[t.name]); refresh(); };
  $('legend').appendChild(chip);
});

// ---- timeline
const tl = $('timeline'), TW = 520, TH = 150, m = {l: 44, r: D.curve ? 46 : 14, t: 20, b: 26};
tl.setAttribute('viewBox', `0 0 ${TW} ${TH}`); tl.setAttribute('preserveAspectRatio', 'none');
const tx = f => m.l + (TW - m.l - m.r) * (F > 1 ? f / (F - 1) : 0);
function series(vals, color, width, axisSide, label, fill) {
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo || 1) * 0.12;
  const ty = v => TH - m.b - (TH - m.t - m.b) * (v - lo + pad) / (hi - lo + 2 * pad);
  const pts = vals.map((v, f) => `${tx(f).toFixed(1)},${ty(v).toFixed(1)}`).join(' ');
  if (fill) svgEl('polygon', {points: `${tx(0)},${TH - m.b} ${pts} ${tx(F - 1)},${TH - m.b}`, fill, stroke: 'none'}, tl);
  svgEl('polyline', {points: pts, fill: 'none', stroke: color, 'stroke-width': width, 'vector-effect': 'non-scaling-stroke'}, tl);
  const x = axisSide === 'l' ? m.l - 5 : TW - m.r + 5, anchor = axisSide === 'l' ? 'end' : 'start';
  if (axisSide) for (const v of [lo, hi]) svgEl('text', {x, y: ty(v) + 4, 'text-anchor': anchor, 'font-size': 10.5, fill: color}, tl).textContent =
    Math.abs(hi) >= 100 ? Math.round(v) : v.toFixed(1);
  return label;
}
series(D.bsa, '#b0b0b0', 1.5, '', '', '#ececec');
series(D.total, INK, 2, 'l');
if (D.curve) series(D.curve, '#E64B35', 2, 'r');
svgEl('text', {x: m.l, y: 13, 'font-size': 11.5, fill: INK, 'font-weight': 'bold'}, tl).textContent = 'Contacts';
svgEl('text', {x: m.l + 62, y: 13, 'font-size': 11.5, fill: '#9a9a9a'}, tl).textContent = '■ buried surface';
if (D.curve) svgEl('text', {x: TW - m.r, y: 13, 'text-anchor': 'end', 'font-size': 11.5, fill: '#E64B35'}, tl).textContent = D.curveLabel;
svgEl('text', {x: (m.l + TW - m.r) / 2, y: TH - 6, 'text-anchor': 'middle', 'font-size': 11, fill: '#8c8c8c'}, tl).textContent = D.xlabel;
svgEl('text', {x: m.l, y: TH - 6, 'text-anchor': 'start', 'font-size': 10.5, fill: '#8c8c8c'}, tl).textContent = fmtX(0);
svgEl('text', {x: TW - m.r, y: TH - 6, 'text-anchor': 'end', 'font-size': 10.5, fill: '#8c8c8c'}, tl).textContent = fmtX(F - 1);
const cursor = svgEl('line', {y1: m.t, y2: TH - m.b, stroke: '#E64B35', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke'}, tl);
function fmtX(f) { const x = D.x[f]; return D.kind === 'md' ? x.toFixed(1) : x.toFixed(2); }
function scrubTo(ev) {
  const r = tl.getBoundingClientRect(), u = ((ev.clientX - r.left) / r.width * TW - m.l) / (TW - m.l - m.r);
  show(Math.max(0, Math.min(F - 1, Math.round(u * (F - 1)))));
}
tl.addEventListener('pointerdown', ev => { tl.setPointerCapture(ev.pointerId); scrubTo(ev); });
tl.addEventListener('pointermove', ev => { if (ev.buttons) scrubTo(ev); });

// ---- per-frame update
function update2D(f) {
  for (const e of edges) {
    const c = D.contacts[e.k], o = visible(c) ? c.occ[f] : 0, sel = selected === e.k;
    e.g.setAttribute('opacity', Math.max(o, sel ? 0.5 : 0).toFixed(2));
    e.g.style.pointerEvents = o > 0.05 || sel ? 'auto' : 'none';
    e.path.setAttribute('stroke-width', (sel ? 4 : 0.8 + 1.6 * o).toFixed(2));
    if (e.dist) e.dist.textContent = c.dist[f].toFixed(1) + ' Å';
  }
  const active = {};
  D.contacts.forEach(c => { if (c.drawn && visible(c)) { active[CA + c.ra] = Math.max(active[CA + c.ra] || 0, c.occ[f]);
                                                          active[CB + c.rb] = Math.max(active[CB + c.rb] || 0, c.occ[f]); } });
  nodes.forEach((n, i) => {
    const ch = i < D.left.length ? CA : CB;
    n.g.setAttribute('opacity', (0.3 + 0.7 * (active[ch + n.r.res] || 0)).toFixed(2));
    n.rect.setAttribute('stroke-width', n.r.area[f] >= D.buriedMin ? 2.2 : 0.8);
  });
  cursor.setAttribute('x1', tx(f)); cursor.setAttribute('x2', tx(f));
  const where = D.kind === 'md' ? `t = ${fmtX(f)} ${D.unit}` : D.kind === 'fep' ? `λ = ${fmtX(f)}` : `phase ${fmtX(f)}`;
  $('status').textContent = `${where}  ·  ${Math.round(D.total[f])} contacts (${Math.round(D.hbonds[f])} hydrogen bonds)  ·  buried surface ${Math.round(D.bsa[f]).toLocaleString()} Å²`
    + (D.curve ? `  ·  ${D.curveLabel.split(' (')[0]} ${(D.curve[f] >= 0 ? '+' : '') + D.curve[f].toFixed(1)} kcal/mol` : '');
  $('scrub').value = f;
}
async function show(f) {
  cur = f; update2D(f);
  if (busy) return;                 // the 3D view catches up with the latest frame asked for
  busy = true;
  while (true) { const g = cur; await viewer.setFrame(g); drawContacts(g); viewer.render(); if (g === cur) break; }
  busy = false;
}
const refresh = () => show(cur);
function toggle() {
  playing = !playing; $('play').textContent = playing ? '❚❚' : '▶';
  clearInterval(timer);
  if (playing) timer = setInterval(() => show(cur + 1 < F ? cur + 1 : 0), 1000 / +$('speed').value);
}

// ---- wiring
$('title').textContent = D.title; document.title = D.title;
$('bA').textContent = 'From ' + D.sides[0]; $('bB').textContent = 'From ' + D.sides[1];
$('lA').textContent = D.sides[0]; $('lB').textContent = D.sides[1];
$('lA').style.color = COL[CA]; $('lB').style.color = COL[CB];
$('scrub').max = F - 1;
$('play').onclick = toggle;
$('scrub').oninput = e => show(+e.target.value);
$('speed').onchange = () => { if (playing) { toggle(); toggle(); } };
$('labels').onchange = refresh; $('names').onchange = refresh;
$('showA').onchange = $('showB').onchange = () => { styleAll(); refresh(); };
document.querySelectorAll('#views button[data-view]').forEach(b => b.onclick = () => { rocking = false; flyTo(viewOf(b.dataset.view)); });
$('tour').onclick = tour;
$('rock').onclick = () => { rocking = !rocking; $('rock').classList.toggle('on', rocking); rocking ? rock() : ++camJob; };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'ArrowRight') show(Math.min(F - 1, cur + 1));
  if (e.key === 'ArrowLeft') show(Math.max(0, cur - 1));
});
window.addEventListener('resize', () => viewer.resize());
measureViews();
viewer.setView(viewOf('interface'));
show(0).then(() => { if (/autoplay/.test(location.hash + location.search)) toggle(); if (/tour/.test(location.hash + location.search)) tour(); });
</script>
</body>
