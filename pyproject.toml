[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-tango"
dynamic = ["version"]
description = "Animated protein-protein interface contacts from normal modes, molecular dynamics and free energy perturbation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "ppitango/vendor/3Dmol-LICENSE"]
keywords = ["structural biology", "protein-protein interactions", "interface", "molecular dynamics",
            "normal mode analysis", "free energy perturbation", "animation", "visualization"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandappi @ git+https://github.com/pritampanda15/PandaPPI",
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
md = ["MDAnalysis>=2.0"]
movie3d = ["pymol-open-source-whl"]
blender = ["molecularnodes[bpy]"]   # Python 3.11 only
test = ["pytest"]

[project.scripts]
ppitango = "ppitango.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ppitango.__version__"}

[tool.setuptools.packages.find]
include = ["ppitango*"]

[tool.setuptools.package-data]
ppitango = ["viewer.html", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
