name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]   # the Linux runner image no longer offers 3.9
        include:
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[md,test,movie3d]"
      - run: pytest -q
      - name: The README commands, as a new user would run them
        run: |
          ppitango nma examples/data/1BRS.pdb --chains A D --seconds 3 -o out/nma
          ppitango md examples/simulations/output/md_1brs/top.pdb examples/simulations/output/md_1brs/traj.dcd \
            --chains A D --dt 0.1 --max-frames 30 --seconds 3 --gif -o out/md
          ppitango fep examples/simulations/output/fep_1brs/top.pdb examples/simulations/output/fep_1brs/window_*.dcd \
            --chains A D --dg examples/simulations/output/fep_1brs/dg.csv --frames-per-window 3 --seconds 3 -o out/fep
          ls -la out
      - name: One run in every format (GROMACS, Amber, CHARMM), all must give the same contacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          bash examples/formats/run_all.sh
          python examples/formats/compare.py
      - name: 3D movie with PyMOL from pip, a ligand side and a zinc side
        run: |
          ppitango nma examples/data/1BRS.pdb --chains A D --movie3d --no-movie --no-viewer --seconds 1 --fps 6 -o out/3d
          ppitango nma examples/data/6M0J.pdb --select "chainID A" "resname ZN" --frames 6 --no-movie -o out/zinc
          ls -la out/3d_3d.mp4 out/zinc_viewer.html
      - name: Keep the 3D movie, to look at what each system drew
        uses: actions/upload-artifact@v4
        with:
          name: movie3d-${{ matrix.os }}-${{ matrix.python }}
          path: out/3d_3d.mp4
          retention-days: 14

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the only one Blender's Python module is built for
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6
      - run: pip install ".[md,test,blender]"
      - run: pytest -q
      - name: Blender scene from the command line
        run: |
          ppitango nma examples/data/1BRS.pdb --chains A D --no-movie --no-viewer --seconds 2 --blender -o out/scene
          ls -la out/scene.blend
      - uses: actions/upload-artifact@v4
        with:
          name: blender-scene
          path: out/scene.blend
          retention-days: 14
